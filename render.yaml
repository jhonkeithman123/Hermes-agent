services:
  - type: web
    name: my-hermes-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HERMES_PROVIDER
        value: gemini
      - key: HERMES_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false

